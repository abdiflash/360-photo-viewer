<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viewer Foto 360° Modern</title>
  
  <!-- CDN Pannellum CSS & JS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pannellum/2.5.6/pannellum.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0f172a;
      color: #ffffff;
    }
    #panorama {
      width: 100vw;
      height: 100vh;
    }
    
    /* Overlay UI Modern (Glassmorphism) */
    .ui-container {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 8px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    #file-input { display: none; }

    /* Dropzone Layar Penuh (Awal) */
    #drop-zone {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #0f172a;
      z-index: 10;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      text-align: center;
      padding: 20px;
    }
    #drop-zone.hidden { display: none; }
    #drop-zone h2 { font-size: 1.5rem; margin-bottom: 8px; font-weight: 600; }
    #drop-zone p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px; }
  </style>
</head>
<body>

  <!-- Screen Awal untuk Memilih / Drag File -->
  <div id="drop-zone">
    <h2>Tarik & Lepas Foto 360° Ke Sini</h2>
    <p>Mendukung format JPEG / PNG (Equirectangular) dari kamera 360°</p>
    <button class="btn" style="padding: 12px 24px; font-size: 15px;" onclick="document.getElementById('file-input').click()">
      📂 Pilih File Foto
    </button>
  </div>

  <!-- Container Elemen 360° Viewer -->
  <div id="panorama"></div>

  <!-- Floating Navigation Bar -->
  <div class="ui-container">
    <input type="file" id="file-input" accept="image/jpeg, image/jpg, image/png">
    <button class="btn" onclick="document.getElementById('file-input').click()">📁 Buka Foto</button>
    <button class="btn" id="btn-autorotate">🔄 Putar Otomatis</button>
    <button class="btn" id="btn-fullscreen">⛶ Fullscreen</button>
  </div>

  <script>
    let viewer = null;
    let autoRotateState = false;
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');

    function render360(imageSrc) {
      if (viewer) {
        viewer.destroy();
      }
      dropZone.classList.add('hidden');

      viewer = pannellum.viewer('panorama', {
        "type": "equirectangular",
        "panorama": imageSrc,
        "autoLoad": true,
        "autoRotate": 0,
        "compass": false,
        "showZoomCtrl": false,
        "showFullscreenCtrl": false,
        "mouseZoom": true,
        "touchPanSpeedCoeffFactor": 1
      });
    }

    fileInput.addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const objectUrl = URL.createObjectURL(file);
        render360(objectUrl);
      }
    });

    // Fitur Drag & Drop Foto
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) {
        const file = e.dataTransfer.files[0];
        if (file.type.startsWith('image/')) {
          const objectUrl = URL.createObjectURL(file);
          render360(objectUrl);
        }
      }
    });

    // Kontrol Tombol UI
    document.getElementById('btn-autorotate').addEventListener('click', () => {
      if (viewer) {
        autoRotateState = !autoRotateState;
        viewer.startAutoRotate(autoRotateState ? -3 : 0);
      }
    });

    document.getElementById('btn-fullscreen').addEventListener('click', () => {
      if (viewer) {
        viewer.toggleFullscreen();
      }
    });
  </script>
</body>
</html>
